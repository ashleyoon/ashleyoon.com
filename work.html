        <noscript>
          <div class="projects-grid">
            <a href="project2.html" class="project-card">
              <div class="project-card-image"><img src="/images/editorial-cover.webp" alt="Editorial Spreads" /></div>

    <!-- Project dialog -->
    <div class="work-dialog" id="workDialog" role="dialog" aria-modal="true" aria-labelledby="workDialogTitle">
      <aside class="work-rail">
        <div class="work-rail__nav">
          <button class="work-dialog__close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
            </svg>
          </button>
          <div class="work-nav">
            <button class="work-nav__prev" type="button" aria-label="Previous project">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 18 5 12 11 6"/>
              </svg>
            </button>
            <button class="work-nav__next" type="button" aria-label="Next project">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="work-rail__scroll">
          <h2 class="work-dialog__title" id="workDialogTitle"></h2>
          <p class="work-dialog__blurb"></p>
          <div class="work-meta" id="workMeta"></div>
        </div>
      </aside>

      <div class="work-stage" id="workStage">
        <button class="work-side work-side--prev" id="workSidePrev" type="button" aria-label="Previous image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button class="work-side work-side--next" id="workSideNext" type="button" aria-label="Next image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </div>

    <script>
      // Live clock in the sidebar footer
      function updateTime() {
        const el = document.getElementById("liveTime");
        if (el)
          el.textContent = new Date().toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
      }
      updateTime();
      setInterval(updateTime, 1000);

      const cursor = document.querySelector(".custom-cursor");
      document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
      });
      document.addEventListener("mouseover", (e) => {
        if (e.target.closest("a, button, .work-card")) cursor.classList.add("hover");
      });
      document.addEventListener("mouseout", (e) => {
        if (e.target.closest("a, button, .work-card")) cursor.classList.remove("hover");
      });
    </script>
    <script src="/sound.js" defer></script>
    <script src="/work.js" defer></script>
  </body>
</html>
