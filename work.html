<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work - Ashley Yoon</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="custom-cursor"></div>

    <div class="about-page">
      <div class="about-page-inner">
        <a href="/" class="back-button back-button--circle" aria-label="Back to home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
        </a>
        <div class="work-grid" id="workGrid"></div>

        <noscript>
          <div class="projects-grid">
            <a href="project2.html" class="project-card">
              <div class="project-card-image"><img src="/images/editorial-cover.webp" alt="Editorial Spreads" /></div>
              <div class="project-card-info"><div class="project-card-top"><h3>Editorial Spreads</h3></div></div>
            </a>
            <a href="project3.html" class="project-card">
              <div class="project-card-image"><img src="/images/helvetica-hero-3.webp" alt="Helvetica Type Specimen" /></div>
              <div class="project-card-info"><div class="project-card-top"><h3>Helvetica Type Specimen</h3></div></div>
            </a>
          </div>
        </noscript>
      </div>
    </div>

    <!-- Project dialog -->
    <div class="work-dialog" id="workDialog" role="dialog" aria-modal="true" aria-labelledby="workDialogTitle">
      <aside class="work-rail">
        <div class="work-rail__nav">
          <button class="work-dialog__close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
            </svg>
          </button>
          <div class="work-nav">
            <button class="work-nav__prev" type="button" aria-label="Previous image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 18 5 12 11 6"/>
              </svg>
            </button>
            <button class="work-nav__next" type="button" aria-label="Next image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="work-rail__scroll">
          <h2 class="work-dialog__title" id="workDialogTitle"></h2>
          <p class="work-dialog__blurb"></p>
          <div class="work-meta" id="workMeta"></div>
        </div>
      </aside>

      <div class="work-stage" id="workStage"></div>
      <span class="work-stage__count" id="workCount"></span>
    </div>

    <script>
      const cursor = document.querySelector(".custom-cursor");
      document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
      });
      document.addEventListener("mouseover", (e) => {
        if (e.target.closest("a, button, .work-card")) cursor.classList.add("hover");
      });
      document.addEventListener("mouseout", (e) => {
        if (e.target.closest("a, button, .work-card")) cursor.classList.remove("hover");
      });
    </script>
    <script src="/work.js" defer></script>
  </body>
</html>
