<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helvetica Type Specimen - Ashley Yoon</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="custom-cursor"></div>

    <div class="about-page">
      <div class="about-page-inner">
          <!-- Back Button -->
          <a href="/work.html" class="back-button back-button--circle" aria-label="Back to other work">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
          </a>

          <!-- Project Header -->
          <div class="project-detail-header">
              <h1>Helvetica Type Specimen</h1>
          </div>

          <!-- Hero Images -->
          <div class="project-hero-image">
              <img src="./images/helvetica-hero-1.webp" alt="Postcard mockup">
          </div>

          <div class="project-hero-image">
              <img src="./images/helvetica-hero-2.webp" alt="Postcard mockup 1">
          </div>

          <div class="project-hero-image">
              <img src="./images/helvetica-hero-3.webp" alt="Postcard mockup 2">
          </div>

          <div class="project-images-grid">
              <img src="./images/helvetica-detail-1.webp" alt="Detail 1">
              <img src="./images/helvetica-detail-2.webp" alt="Detail 2">
              <img src="./images/helvetica-detail-3.webp" alt="Detail 3">
              <img src="./images/helvetica-detail-4.webp" alt="Detail 4">
              <img src="./images/helvetica-detail-5.webp" alt="Detail 5">
              <img src="./images/helvetica-detail-6.webp" alt="Detail 6">
          </div>

      </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Enlarged view">
    </div>

    <script>
        // Live clock
        function updateTime() {
            const el = document.getElementById('liveTime');
            if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Custom cursor
        const cursor = document.querySelector('.custom-cursor');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a, button, .lightbox-close, .project-images-grid img, .project-hero-image img').forEach(element => {
            element.addEventListener('mouseenter', () => cursor.classList.add('hover'));
            element.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
        });

        // Lightbox functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.querySelector('.lightbox-close');

        document.querySelectorAll('.project-images-grid img, .project-hero-image img').forEach(img => {
            img.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = img.src;
            });
        });

        lightboxClose.addEventListener('click', () => {
            lightbox.style.display = 'none';
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.style.display = 'none';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.style.display === 'flex') {
                lightbox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
